<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found — Stream Yours'</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root { color-scheme: light dark; --bg:#e3e8ef; --fg:#1b2a41; --muted:#55657d; --accent:#2f6394; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0c1320; --fg:#e8eef7; --muted:#9db0c9; --accent:#5aa3e6; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align:center; }
    main { max-width:420px; }
    img { width:96px; height:96px; }
    h1 { font-size:1.6rem; margin:12px 0 6px; }
    p { color:var(--muted); line-height:1.55; margin:0 0 20px; }
    a { display:inline-block; padding:12px 22px; border-radius:999px; background:var(--accent); color:#fff; text-decoration:none; font-weight:700; }
    a:focus-visible { outline:3px solid var(--fg); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="96" height="96" />
    <h1>That page isn't here</h1>
    <p>The link may be old or mistyped. Stream Yours' lives on the home page — head back to browse or host videos.</p>
    <a href="/">Back to Stream Yours'</a>
  </main>
</body>
</html>
