<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Stream Yours'</title>
    <meta name="description" content="Stream Yours' — Stream movies and series live across hosted devices." />
    <meta name="author" content="Sanchar Koirala" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stream Yours'" />
    <meta name="theme-color" content="#e3e8ef" id="metaThemeColor" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" id="faviconLink" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <!-- Firebase Realtime Database Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

    <!-- PeerJS WebRTC P2P & MP4Box Progressive Fragmentation -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>

    <style>
      /* ============================================================
         THEME 1 (LIGHT): SOFT COOL GREY, STEEL BLUE & NAVY BLUE
         ============================================================ */
      :root[data-theme="light"] {
        --bg: #e3e8ef;
        --surface: #ebf0f6;
        --surface-alt: #f4f7fc;
        --neu-out: 7px 7px 15px #c1cad6, -7px -7px 15px #ffffff;
        --neu-out-sm: 4px 4px 9px #c1cad6, -4px -4px 9px #ffffff;
        --neu-in: inset 4px 4px 8px #c1cad6, inset -4px -4px 8px #ffffff;
        --stroke: rgba(255, 255, 255, 0.74);
        --divider: rgba(16, 35, 60, 0.08);
        --text: #10233c;
        --text-2: #445a74;
        --text-muted: #6c8099;
        --steel: #2f6394;
        --steel-bright: #3d79b0;
        --steel-soft: rgba(47, 99, 148, 0.12);
        --navy: #142b47;
        --navy-soft: rgba(20, 43, 71, 0.09);
        --brand-grad: linear-gradient(135deg, #2f6394 0%, #10233c 100%);
        --brand-shadow: 0 6px 16px rgba(16, 35, 60, 0.24);
        --green: #169c5b;
        --amber: #d97706;
      }

      /* ============================================================
         THEME 2 (DARK): DEEP NAVY, MIDNIGHT SLATE & LUMINOUS STEEL BLUE
         ============================================================ */
      :root[data-theme="dark"] {
        --bg: #0c1320;
        --surface: #121c2e;
        --surface-alt: #18253d;
        --neu-out: 7px 7px 16px #060a12, -6px -6px 14px #1a2842;
        --neu-out-sm: 4px 4px 10px #060a12, -4px -4px 10px #1a2842;
        --neu-in: inset 4px 4px 9px #060a12, inset -4px -4px 9px #1a2842;
        --stroke: rgba(139, 188, 232, 0.08);
        --divider: rgba(139, 188, 232, 0.09);
        --text: #edf2f8;
        --text-2: #9db2cc;
        --text-muted: #69809c;
        --steel: #5b9bd5;
        --steel-bright: #75b0e6;
        --steel-soft: rgba(91, 155, 213, 0.16);
        --navy: #8bbce8;
        --navy-soft: rgba(139, 188, 232, 0.12);
        --brand-grad: linear-gradient(135deg, #5b9bd5 0%, #244b78 100%);
        --brand-shadow: 0 6px 18px rgba(6, 10, 18, 0.55);
        --green: #2ecc80;
        --amber: #f59e0b;
      }

      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        height: var(--app-height, 100dvh);
        max-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }

      body {
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        transition: background 0.2s ease, color 0.2s ease;
      }

      html.fs-lock,
      body.fs-lock {
        position: fixed !important;
        inset: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        max-width: none !important;
        max-height: none !important;
        background: #000000 !important;
        overflow: hidden !important;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: -0.2px;
        font-variant-numeric: tabular-nums;
      }

      /* ============================================================
         STATIC SIGNAL STRENGTH BARS
         ============================================================ */
      .sig-bars {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 11px;
        flex-shrink: 0;
      }
      .sig-bars i {
        width: 2.5px;
        border-radius: 1.5px;
        background: var(--divider);
        display: block;
      }
      .sig-bars i:nth-child(1) { height: 4px; }
      .sig-bars i:nth-child(2) { height: 7.5px; }
      .sig-bars i:nth-child(3) { height: 11px; }
      .sig-bars.s3 i { background: var(--steel); }
      .sig-bars.s2 i:nth-child(1),
      .sig-bars.s2 i:nth-child(2) { background: var(--steel); }
      .sig-bars.s1 i:nth-child(1) { background: var(--amber); }

      /* ============================================================
         ONE UI + iOS FILES TOP BAR
         ============================================================ */
      .top-bar {
        padding: 12px 18px 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-shrink: 0;
        z-index: 25;
      }

      .brand-box {
        display: flex;
        align-items: center;
        gap: 11px;
        cursor: pointer;
        flex-shrink: 0;
      }

      .squircle-logo {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: var(--brand-grad);
        box-shadow: var(--brand-shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        flex-shrink: 0;
      }

      .brand-meta {
        display: flex;
        flex-direction: column;
      }

      .brand-title {
        font-size: 16.5px;
        font-weight: 800;
        letter-spacing: -0.2px;
        color: var(--text);
        line-height: 1.15;
      }

      .telemetry-strip {
        margin-top: 3px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-2);
      }

      .top-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        justify-content: flex-end;
        min-width: 0;
      }

      .search-well {
        width: 100%;
        max-width: 240px;
        height: 38px;
        border-radius: 19px;
        background: var(--surface);
        box-shadow: var(--neu-in);
        border: 1px solid var(--stroke);
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-2);
      }
      .search-well:focus-within { border-color: var(--steel); }
      .search-well input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 13px;
        font-weight: 500;
        font-family: inherit;
        user-select: text;
      }
      .search-well input::placeholder { color: var(--text-muted); }

      .morph-btn {
        height: 38px;
        padding: 0 14px;
        border-radius: 19px;
        background: var(--surface);
        box-shadow: var(--neu-out-sm);
        border: 1px solid var(--stroke);
        color: var(--text);
        font-size: 12px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        flex-shrink: 0;
        white-space: nowrap;
        transition: transform 0.12s ease, box-shadow 0.12s ease, color 0.12s ease, border-color 0.15s ease;
      }
      .morph-btn:hover { color: var(--steel); }
      .morph-btn:active {
        transform: scale(0.96);
        box-shadow: var(--neu-in);
      }
      .morph-btn.icon-sq {
        width: 38px;
        padding: 0;
        border-radius: 14px;
      }
      .morph-btn.accent {
        background: var(--brand-grad);
        color: #ffffff;
        border-color: transparent;
        box-shadow: var(--brand-shadow);
      }
      .morph-btn.accent:hover {
        color: #ffffff;
        opacity: 0.94;
      }

      /* Host Action Pills in Top Bar */
      .host-action-group {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        flex-shrink: 0;
      }

      .host-chip {
        height: 38px;
        padding: 0 12px;
        border-radius: 15px;
        background: var(--surface);
        box-shadow: var(--neu-out-sm);
        border: 1px solid var(--stroke);
        color: var(--steel);
        font-size: 12px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        max-width: 150px;
        transition: transform 0.12s ease, border-color 0.15s ease;
      }
      .host-chip:hover { border-color: var(--steel); }
      .host-chip:active {
        transform: scale(0.96);
        box-shadow: var(--neu-in);
      }
      .host-chip span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ============================================================
         ONE UI / iOS FILES FILTER & SMART SORT RIBBON
         ============================================================ */
      .filter-bar {
        padding: 4px 18px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        flex-shrink: 0;
      }

      .segmented-group {
        display: inline-flex;
        align-items: center;
        padding: 3px;
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--neu-in);
        border: 1px solid var(--stroke);
        gap: 3px;
      }

      .seg-tab {
        height: 30px;
        padding: 0 13px;
        border-radius: 13px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-2);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .seg-tab:hover { color: var(--text); }
      .seg-tab.active {
        background: var(--surface-alt);
        box-shadow: var(--neu-out-sm);
        color: var(--steel);
      }

      .select-filters {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }

      .morph-select-wrap {
        height: 36px;
        padding: 0 11px;
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--neu-out-sm);
        border: 1px solid var(--stroke);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text-2);
        font-size: 12px;
        font-weight: 700;
        transition: border-color 0.15s ease;
      }
      .morph-select-wrap:focus-within {
        border-color: var(--steel);
      }

      .morph-select-wrap select {
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 12px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .morph-select-wrap select option {
        background: var(--surface);
        color: var(--text);
      }

      /* Contextual Sort Direction Custom Div Button (↓ Ascending / ↑ Descending) */
      .sort-dir-btn {
        position: relative;
        width: 36px;
        height: 36px;
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--neu-out-sm);
        border: 1px solid var(--stroke);
        color: var(--steel);
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
      }
      .sort-dir-btn.visible {
        display: inline-flex;
      }
      .sort-dir-btn:hover {
        border-color: var(--steel);
        background: var(--surface-alt);
      }
      .sort-dir-btn:active {
        transform: scale(0.94);
        box-shadow: var(--neu-in);
      }
      .sort-dir-arrow {
        display: block;
        transition: transform 0.2s ease;
      }
      .sort-dir-btn.desc .sort-dir-arrow {
        transform: rotate(180deg);
      }

      .sort-dir-tip {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        padding: 6px 10px;
        border-radius: 11px;
        background: var(--surface-alt);
        box-shadow: var(--neu-out);
        border: 1px solid var(--stroke);
        color: var(--text);
        font-size: 11px;
        font-weight: 700;
        line-height: 1.25;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transform: translateY(-4px) scale(0.97);
        transition: opacity 0.16s ease, transform 0.16s ease;
        z-index: 55;
      }
      @media (hover: hover) and (pointer: fine) {
        .sort-dir-btn:hover .sort-dir-tip,
        .sort-dir-btn:focus-visible .sort-dir-tip {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* ============================================================
         MAIN SCROLLABLE EXPLORER WORKSPACE
         ============================================================ */
      .explorer-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px 18px 20px;
        position: relative;
      }
      .explorer-scroll::-webkit-scrollbar { width: 5px; }
      .explorer-scroll::-webkit-scrollbar-thumb {
        background: var(--divider);
        border-radius: 99px;
      }

      .explorer-scroll.drag-over {
        outline: 2px dashed var(--steel);
        outline-offset: -8px;
        border-radius: 22px;
        background: var(--steel-soft);
      }

      .category-section {
        margin-bottom: 22px;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 4px 10px;
      }

      .section-title-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-heading {
        font-size: 15px;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.2px;
      }

      .count-badge {
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--steel-soft);
        color: var(--steel);
        font-size: 11px;
        font-weight: 800;
      }

      /* iOS Files Squircle Grid */
      .files-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
        gap: 15px;
      }

      .file-tile {
        background: var(--surface);
        box-shadow: var(--neu-out);
        border: 1px solid var(--stroke);
        border-radius: 24px;
        padding: 11px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        cursor: pointer;
        transition: transform 0.14s ease, border-color 0.14s ease;
      }
      .file-tile:hover {
        transform: translateY(-2px);
        border-color: var(--steel);
      }
      .file-tile:active {
        transform: scale(0.985);
        box-shadow: var(--neu-in);
      }

      .thumb-frame {
        width: 100%;
        aspect-ratio: 16 / 10;
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
        background: var(--navy);
      }
      .thumb-frame svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .tile-body {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 0 2px;
      }

      .tile-name {
        font-size: 13.5px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }

      .tile-tags {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
      }

      .spec-pill {
        padding: 2px 6px;
        border-radius: 6px;
        background: var(--steel-soft);
        color: var(--steel);
        font-size: 10px;
        font-weight: 800;
      }

      .tile-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        font-size: 10.5px;
        font-weight: 700;
        color: var(--text-muted);
      }

      .host-tag {
        padding: 2px 7px;
        border-radius: 7px;
        background: var(--navy-soft);
        color: var(--navy);
        font-size: 10.5px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        max-width: 125px;
      }
      .host-tag span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Samsung One UI Grouped List View */
      .oneui-list-card {
        background: var(--surface);
        box-shadow: var(--neu-out);
        border: 1px solid var(--stroke);
        border-radius: 26px;
        overflow: hidden;
      }

      .oneui-row {
        padding: 11px 15px;
        display: flex;
        align-items: center;
        gap: 13px;
        cursor: pointer;
        border-bottom: 1px solid var(--divider);
        transition: background 0.12s ease;
      }
      .oneui-row:last-child { border-bottom: none; }
      .oneui-row:hover { background: var(--steel-soft); }
      .oneui-row:active { background: var(--navy-soft); }

      .row-thumb {
        width: 72px;
        height: 48px;
        border-radius: 13px;
        overflow: hidden;
        flex-shrink: 0;
        box-shadow: var(--neu-out-sm);
      }
      .row-thumb svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .row-info {
        flex: 1;
        min-width: 0;
      }

      .row-name {
        font-size: 13.5px;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .row-sub {
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
      }

      .row-chevron {
        width: 30px;
        height: 30px;
        border-radius: 11px;
        background: var(--surface-alt);
        box-shadow: var(--neu-out-sm);
        color: var(--steel);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-weight: 800;
      }

      /* Series Header Card (Inside a Series Folder) */
      .series-head-card {
        background: var(--surface);
        box-shadow: var(--neu-out);
        border: 1px solid var(--stroke);
        border-radius: 26px;
        padding: 15px 18px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }

      .series-head-left {
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 0;
        flex: 1;
      }

      .series-head-thumb {
        width: 84px;
        height: 54px;
        border-radius: 16px;
        overflow: hidden;
        flex-shrink: 0;
        box-shadow: var(--neu-out-sm);
      }
      .series-head-thumb svg { width: 100%; height: 100%; display: block; }

      .empty-card {
        max-width: 370px;
        margin: 44px auto;
        background: var(--surface);
        box-shadow: var(--neu-out);
        border: 1px solid var(--stroke);
        border-radius: 28px;
        padding: 28px 22px;
        text-align: center;
      }
      .empty-card h3 {
        margin: 0 0 6px;
        font-size: 16px;
        font-weight: 800;
      }
      .empty-card p {
        margin: 0 0 18px;
        color: var(--text-2);
        font-size: 12.5px;
        line-height: 1.45;
      }

      footer {
        padding: 7px 18px 9px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .storage-meter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .storage-track {
        width: 56px;
        height: 5px;
        border-radius: 99px;
        background: var(--surface);
        box-shadow: var(--neu-in);
        overflow: hidden;
      }
      .storage-fill {
        height: 100%;
        width: 0%;
        border-radius: 99px;
        background: var(--steel);
        transition: width 0.3s ease;
      }

      /* ============================================================
         CINEMA PLAYER & TRUE EDGE-TO-EDGE FULLSCREEN MODE
         ============================================================ */
      .player-screen {
        display: none;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
        height: var(--app-height, 100dvh);
        max-height: 100dvh;
        background: #070b14;
        z-index: 100;
        flex-direction: column;
        overflow: hidden;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      .player-screen.open { display: flex; }

      .player-screen:fullscreen,

      .ctrl-row {

    <script>
      /* ============================================================

      (function initFaviconFallback() {

      function detectDefaultDeviceName() {
        const ua = navigator.userAgent || '';
        if (/Android/i.test(ua)) return `Android-${sessionSuffix}`;
        if (/iPhone/i.test(ua)) return `iPhone-${sessionSuffix}`;
        if (/iPad/i.test(ua)) return `iPad-${sessionSuffix}`;
        if (/Windows/i.test(ua)) return `Windows-${sessionSuffix}`;
        if (/Macintosh|Mac OS X/i.test(ua)) return `Mac-${sessionSuffix}`;

        return `Device-${sessionSuffix}`;
      }

      /* ============================================================
         3. SMART FILENAME PARSER (TITLE, YEAR, RES, CODEC, AUDIO)
         ============================================================ */
      function parseMediaMetadata(rawFilename, isFolder = false) {
        const extMatch = !isFolder ? rawFilename.match(/\.([a-zA-Z0-9]{2,5})$/) : null;
        const ext = extMatch ? extMatch[1].toUpperCase() : '';
        const base = !isFolder ? rawFilename.replace(/\.[^/.]+$/, '') : rawFilename;

        let year = '';
        const bracketYearMatch = base.match(/[\(\[]\s*(19[2-9]\d|20[0-2]\d)\s*[\)\]]/);
        if (bracketYearMatch) {
          year = bracketYearMatch[1];
        }

        const working = base.replace(/[._]+/g, ' ').replace(/\[[^\]]*\]/g, ' ').replace(/\s+/g, ' ').trim();

        let seasonEp = '';
        const seMatch = working.match(/\bS(\d{1,2})\s*E(\d{1,3})\b/i) || working.match(/\b(\d{1,2})x(\d{2})\b/i);
        if (seMatch) {
          seasonEp = `S${seMatch[1].padStart(2, '0')}·E${seMatch[2].padStart(2, '0')}`;
        }

        let res = '';
        if (/\b(2160p|4K|UHD)\b/i.test(working)) res = '4K';
        else if (/\b1440p\b/i.test(working)) res = '2K';
        else if (/\b1080p\b/i.test(working)) res = '1080p';
        else if (/\b720p\b/i.test(working)) res = '720p';
        else if (/\b480p\b/i.test(working)) res = '480p';

        let codec = '';
        if (/\b(HDR10|HDR|DV|Dolby\s*Vision)\b/i.test(working)) codec = 'HDR';
        else if (/\b(HEVC|x265|H\s*265)\b/i.test(working)) codec = 'HEVC';

        let audioTag = '';
        if (/\b(Dual\s*Audio|Multi\s*Audio)\b/i.test(working)) audioTag = 'DUAL';
        else if (/\bHindi\b/i.test(working)) audioTag = 'HIN';
        else if (/\bJapanese\b/i.test(working)) audioTag = 'JPN';
        else if (/\bKorean\b/i.test(working)) audioTag = 'KOR';

        if (!year) {
          const allYears = [...working.matchAll(/\b(19[2-9]\d|20[0-2]\d)\b/g)];
          if (allYears.length > 0) {
            year = allYears[allYears.length - 1][1];
          }
        }

        const releaseYear = year ? parseInt(year, 10) : 0;

        let stripped = working
          .replace(/\b(2160p|1440p|1080p|720p|480p|4K|UHD|WEB-?DL|WEBRip|BluRay|BRRip|BDRip|HDRip|DVDRip|HDTV|CAMRip|CAM|TS|HEVC|x265|x264|H264|H265|10bit|10-bit|8bit|AAC|AC3|DTS|DDP5\s*1|DD5\s*1|Atmos|TrueHD|Dual\s*Audio|Multi\s*Audio|ESub|ESubs|YIFY|RARBG|PSA|EVO|FGT|SPARKS|AMIABLE|EXTENDED|REMASTERED|UNRATED|DIRECTORS\s*CUT)\b/gi, ' ')
          .replace(/\(\s*\)/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();

        if (year) {
          const lastYearRegex = new RegExp(`\\(?\\b${year}\\b\\)?(?![\\s\\S]*\\b${year}\\b)`);
          const withoutReleaseYear = stripped.replace(lastYearRegex, ' ').replace(/\(\s*\)/g, ' ').replace(/\s+/g, ' ').trim();
          if (withoutReleaseYear.length >= 1) {
            stripped = withoutReleaseYear;
          }
        }

        const cleanName = stripped.length >= 1 ? stripped : working;
        const specs = [year, res, audioTag, codec].filter(Boolean);

        return {
          cleanName,
          year,
          releaseYear,
          res,
          codec,
          audioTag,
          seasonEp,
          ext,
          specs
        };
      }

      /* ============================================================
         4. PROCEDURAL SQUIRCLE POSTERS (MOVIES & SERIES)
         ============================================================ */
      const POSTER_PALETTES = [
        { c1: '#162f4f', c2: '#356a9c', accent: '#90cdf4' },
        { c1: '#10233c', c2: '#2b5b88', accent: '#75b0e6' },
        { c1: '#1b3658', c2: '#42769c', accent: '#bee3f8' },
        { c1: '#132842', c2: '#316085', accent: '#8bbce8' },
        { c1: '#1a2f4b', c2: '#44688e', accent: '#a3cef1' },
        { c1: '#0e2239', c2: '#275580', accent: '#6aa9e3' }
      ];

      function hashString(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function getMonogram(title) {
        const words = title.replace(/[^a-zA-Z0-9\s]/g, '').trim().split(/\s+/).filter(Boolean);
        if (words.length === 0) return 'SY';
        if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
        return (words[0][0] + words[1][0]).toUpperCase();
      }

      function buildCodedThumbnailSvg(item, epNumber = null) {
        const meta = item.meta || parseMediaMetadata(item.name, item.type === 'folder');
        const seed = hashString(`${meta.cleanName}_${item.hostName}`);
        const pal = POSTER_PALETTES[seed % POSTER_PALETTES.length];
        const patternType = seed % 3;
        const isSeries = item.type === 'folder';
        const mono = epNumber !== null ? `E${String(epNumber).padStart(2, '0')}` : getMonogram(meta.cleanName);

        const topLeftBadge = epNumber !== null
          ? (meta.seasonEp || `EP ${String(epNumber).padStart(2, '0')}`)
          : (isSeries ? `${item.count || 0} EP` : (meta.res || meta.ext || 'HD'));

        const topRightBadge = meta.year || (isSeries ? 'SERIES' : meta.ext);

        let progressPct = 0;
        if (item.type === 'file') {
          const prog = getSavedProgress(item.hostId, item.fileKey);
          if (prog && prog.pos > 10 && prog.dur > 0) {
            progressPct = Math.min(100, Math.max(4, Math.round((prog.pos / prog.dur) * 100)));
          }
        }

        let motifSvg = '';
        if (patternType === 0) {
          motifSvg = `
            <circle cx="255" cy="22" r="82" fill="none" stroke="${pal.accent}" stroke-opacity="0.14" stroke-width="14"/>
            <circle cx="255" cy="22" r="46" fill="none" stroke="${pal.accent}" stroke-opacity="0.18" stroke-width="5"/>
          `;
        } else if (patternType === 1) {
          motifSvg = `
            <path d="M-20 142 Q 95 58, 185 118 T 340 68 L 340 200 L -20 200 Z" fill="${pal.accent}" fill-opacity="0.12"/>
            <path d="M-20 166 Q 115 96, 215 144 T 340 104 L 340 200 L -20 200 Z" fill="${pal.accent}" fill-opacity="0.09"/>
          `;
        } else {
          motifSvg = `
            <rect x="200" y="-20" width="122" height="122" rx="28" transform="rotate(22 200 -20)" fill="${pal.accent}" fill-opacity="0.1"/>
            <rect x="225" y="16" width="96" height="96" rx="22" transform="rotate(22 225 16)" fill="none" stroke="${pal.accent}" stroke-opacity="0.2" stroke-width="2"/>
          `;
        }

        const centerArtwork = isSeries
          ? `
            <rect x="128" y="48" width="64" height="14" rx="6" fill="#ffffff" fill-opacity="0.24"/>
            <rect x="122" y="54" width="76" height="16" rx="7" fill="#ffffff" fill-opacity="0.38"/>
            <path d="M116 70 C116 64 120 60 126 60 L145 60 L152 67 L194 67 C200 67 204 71 204 77 L204 112 C204 118 200 122 194 122 L126 122 C120 122 116 118 116 112 Z" fill="#ffffff" fill-opacity="0.94"/>

      function renderSignalBarsHtml(tier = 3) {
        const cls = tier === 1 ? 's1' : (tier === 2 ? 's2' : 's3');

      function formatCompactBytes(bytes) {
        if (!bytes || bytes <= 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
        const val = bytes / Math.pow(1024, i);
        return `${val >= 100 || i === 0 ? Math.round(val) : val.toFixed(1)} ${units[i]}`;
      }

      /* ============================================================
         5. PEERJS WEBRTC P2P NODE & HIGH-THROUGHPUT RANGE SERVER
         ============================================================ */
      function initPeerNode() {
        if (typeof Peer === 'undefined') return;

        const desiredPeerId = `sy-${myHostId.replace(/[^a-zA-Z0-9_-]/g, '')}`;
        peer = new Peer(desiredPeerId, {
          debug: 0,
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' },
              { urls: 'stun:global.stun.twilio.com:3478' }
            ]
          }
        });

        peer.on('open', (id) => {
          myPeerId = id;
          if (isHosting) {
            publishHostCatalogToDb();
          }
        });

        peer.on('connection', (conn) => {
          handleIncomingViewerConnection(conn);
        });

        peer.on('disconnected', () => {
          if (peer && !peer.destroyed) {
            try { peer.reconnect(); } catch (e) {}
          }
        });

        peer.on('error', () => {});
      }

      /**
       * Packs a 12-byte header ([uint32 streamToken, float64 byteOffset]) + binary payload
       * into a single zero-copy ArrayBuffer for WebRTC DataChannel transmission.
       */
      function packBinaryFrame(streamToken, byteOffset, sliceArrayBuffer) {
        const payload = new Uint8Array(sliceArrayBuffer);
        const frame = new ArrayBuffer(12 + payload.byteLength);
        const view = new DataView(frame);
        view.setUint32(0, streamToken >>> 0, true);
        view.setFloat64(4, byteOffset, true);
        new Uint8Array(frame, 12).set(payload);
        return frame;
      }

      function handleIncomingViewerConnection(conn) {
        const activeStreams = new Map(); // streamToken -> { aborted, ackOffset }

        conn.on('data', async (msg) => {
          if (!msg || typeof msg !== 'object') return;

          if (msg.type === 'CANCEL_RANGE') {
            const st = activeStreams.get(msg.streamToken);
            if (st) st.aborted = true;
            return;
          }

          if (msg.type === 'WINDOW_ACK') {
            const st = activeStreams.get(msg.streamToken);
            if (st) st.ackOffset = Math.max(st.ackOffset, Number(msg.ackOffset || 0));
            return;
          }

          if (msg.type === 'REQUEST_RANGE') {
            const streamToken = msg.streamToken >>> 0;
            const fileKey = msg.fileKey;
            const file = localFilesMap.get(fileKey);

            if (!file) {
              if (conn.open) {
                conn.send({
                  type: 'RANGE_ERROR',
                  streamToken,
                  message: 'File unavailable on host'
                });
              }
              return;
            }

            const totalSize = file.size;
            const startByte = Math.max(0, Math.min(totalSize, Math.floor(Number(msg.startByte || 0))));
            const rawEnd = msg.endByte != null ? Math.floor(Number(msg.endByte)) : totalSize;
            const endByte = Math.max(startByte, Math.min(totalSize, rawEnd));

            const state = {
              aborted: false,
              ackOffset: startByte
            };
            activeStreams.set(streamToken, state);

            if (conn.open) {
              conn.send({
                type: 'RANGE_META',
                streamToken,
                fileKey,
                startByte,
                endByte,
                totalSize,
                mimeType: file.type || inferMimeFromName(file.name)
              });
            }

            let cursor = startByte;
            try {
              while (cursor < endByte && !state.aborted && conn.open) {
                // Sliding window backpressure so we stay fast without overflowing SCTP buffer
                const dc = conn.dataChannel;
                const unackedBytes = cursor - state.ackOffset;
                if ((dc && dc.bufferedAmount > BUFFER_HIGH_WATER) || unackedBytes > WINDOW_SIZE * 2) {
                  await new Promise((r) => setTimeout(r, 18));
                  continue;
                }

                const sliceEnd = Math.min(cursor + CHUNK_SIZE, endByte);
                const sliceBuf = await file.slice(cursor, sliceEnd).arrayBuffer();

                if (state.aborted || !conn.open) break;

                const packed = packBinaryFrame(streamToken, cursor, sliceBuf);
                conn.send(packed);
                cursor = sliceEnd;
              }

              if (!state.aborted && conn.open) {
                conn.send({
                  type: 'RANGE_END',
                  streamToken,
                  endByte: cursor,
                  totalSize
                });
              }
            } catch (err) {
              if (conn.open) {
                conn.send({
                  type: 'RANGE_ERROR',
                  streamToken,
                  message: 'Host read interrupted'
                });
              }
            } finally {
              activeStreams.delete(streamToken);
            }
          }
        });

        const cleanup = () => {
          activeStreams.forEach((st) => { st.aborted = true; });
          activeStreams.clear();
        };

        conn.on('close', cleanup);
        conn.on('error', cleanup);
      }

      function inferMimeFromName(name) {
        const ext = (name.split('.').pop() || '').toLowerCase();
        if (ext === 'webm') return 'video/webm';
        if (ext === 'mov') return 'video/mp4';
        if (ext === 'm4v') return 'video/mp4';
        if (ext === 'mkv') return 'video/x-matroska';
        if (ext === 'avi') return 'video/x-msvideo';
        return 'video/mp4';
      }

      /* Drag & Drop Folder/File Support on Main Explorer */
      (function initDragDrop() {
        const zone = document.getElementById('explorerScroll');
        if (!zone) return;

        ['dragenter', 'dragover'].forEach((evt) => {
          zone.addEventListener(evt, (e) => {
            e.preventDefault();
            zone.classList.add('drag-over');
          });
        });

        ['dragleave', 'drop'].forEach((evt) => {
          zone.addEventListener(evt, (e) => {
            e.preventDefault();
            zone.classList.remove('drag-over');
          });
        });

        zone.addEventListener('drop', async (e) => {
          const items = e.dataTransfer && e.dataTransfer.items;
          if (items && items.length > 0 && items[0].webkitGetAsEntry) {
            const collected = [];
            const traverse = async (entry, prefix = '') => {
              if (!entry) return;
              if (entry.isFile) {
                await new Promise((res) => {
                  entry.file((file) => {
                    try {
                      Object.defineProperty(file, 'webkitRelativePath', {
                        value: prefix ? `${prefix}/${file.name}` : file.name
                      });
                    } catch (err) {}
                    collected.push(file);
                    res();
                  }, () => res());
                });
              } else if (entry.isDirectory) {
                const reader = entry.createReader();
                const entries = await new Promise((res) => {
                  const allEntries = [];
                  const readBatch = () => {
                    reader.readEntries((batch) => {
                      if (!batch.length) res(allEntries);
                      else {
                        allEntries.push(...batch);
                        readBatch();
                      }
                    }, () => res(allEntries));
                  };
                  readBatch();
                });
                const nextPrefix = prefix ? `${prefix}/${entry.name}` : entry.name;
                for (const child of entries) {
                  await traverse(child, nextPrefix);
                }
              }
            };

            for (const item of items) {
              const entry = item.webkitGetAsEntry();
              if (entry) await traverse(entry, '');
            }
            if (collected.length > 0) {
              ingestSelectedFiles(collected);
              return;
            }
          }

          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            ingestSelectedFiles(Array.from(e.dataTransfer.files));
          }
        });
      })();

      function isSupportedVideoFile(file) {
        if (!file || !file.name) return false;
        const ext = (file.name.split('.').pop() || '').toLowerCase();
        if (VIDEO_EXTS.has(ext)) return true;
        if (file.type && file.type.startsWith('video/')) return true;
        return false;
      }

      /**
       * Parses selected folder/files into Movies (root-level videos) and Series (subfolder groups).
       */
      async function ingestSelectedFiles(rawFiles) {
        const videoFiles = rawFiles.filter(isSupportedVideoFile);
        if (videoFiles.length === 0) {
          showToast('No video files found');
          return;
        }

        localFilesMap.clear();
        const seriesBuckets = new Map(); // folderName -> { name, episodes: [] }
        const movieItems = [];

        const firstRel = videoFiles[0].webkitRelativePath || '';
        hostedFolderLabel = firstRel.includes('/') ? firstRel.split('/')[0] : 'Shared Videos';

        videoFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        videoFiles.forEach((file, idx) => {
          const fileKey = `f_${idx}_${file.size}_${hashString(file.name + (file.webkitRelativePath || ''))}`;
          localFilesMap.set(fileKey, file);

          const relPath = file.webkitRelativePath || '';
          const parts = relPath.split('/').filter(Boolean);
          const meta = parseMediaMetadata(file.name, false);

          // If path has RootFolder/SubFolder/.../Video.ext (3+ segments), group into Series by immediate subfolder
          if (parts.length >= 3) {
            const seriesFolderName = parts[parts.length - 2];
            if (!seriesBuckets.has(seriesFolderName)) {
              seriesBuckets.set(seriesFolderName, {
                name: seriesFolderName,
                episodes: []
              });
            }
            seriesBuckets.get(seriesFolderName).episodes.push({
              fileKey,
              name: file.name,
              size: file.size,
              sizeLabel: formatCompactBytes(file.size),
              mimeType: file.type || inferMimeFromName(file.name)
            });
          } else {
            movieItems.push({
              type: 'file',
              fileKey,
              name: file.name,
              size: file.size,
              sizeLabel: formatCompactBytes(file.size),
              mimeType: file.type || inferMimeFromName(file.name)
            });
          }
        });

        const catalog = [];

        // Add Series Folders
        seriesBuckets.forEach((bucket, folderName) => {
          bucket.episodes.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
          const totalBytes = bucket.episodes.reduce((acc, ep) => acc + (ep.size || 0), 0);
          catalog.push({
            type: 'folder',
            folderKey: `dir_${hashString(folderName)}`,
            name: folderName,
            count: bucket.episodes.length,
            size: totalBytes,
            sizeLabel: formatCompactBytes(totalBytes),
            episodes: bucket.episodes
          });
        });

        // Add Standalone Movies
        movieItems.forEach((m) => catalog.push(m));

        hostedCatalogItems = catalog;
        isHosting = true;

        updateHostingHeaderUI();
        await publishHostCatalogToDb();
        startHostHeartbeat();

        showToast(`Sharing ${videoFiles.length} video${videoFiles.length === 1 ? '' : 's'}`);
      }

      function updateHostingHeaderUI() {
        const idleGroup = document.getElementById('idleHostControls');
        const activeGroup = document.getElementById('activeHostControls');
        const hostLabel = document.getElementById('activeHostLabel');

        if (isHosting) {
          idleGroup.style.display = 'none';
          activeGroup.style.display = 'inline-flex';
          hostLabel.textContent = myHostName;
        } else {
          idleGroup.style.display = 'inline-flex';
          activeGroup.style.display = 'none';
        }
      }

      async function publishHostCatalogToDb() {
        if (!isHosting) return;

        const hostRef = db.ref(`${DB_HOSTS_PATH}/${myHostId}`);
        if (disconnectRef) {
          try { await disconnectRef.cancel(); } catch (e) {}
        }
        disconnectRef = hostRef.onDisconnect();
        disconnectRef.remove().catch(() => {});

        const payload = {
          id: myHostId,
          name: myHostName,
          peerId: myPeerId || '',
          folderName: hostedFolderLabel,
          lastSeen: firebase.database.ServerValue.TIMESTAMP,
          items: hostedCatalogItems
        };

        // Update local snapshot immediately so host sees own library with 0ms delay
        latestHostsSnapshot[myHostId] = {
          ...payload,
          lastSeen: getServerNowMs()
        };
        reconcileGlobalHosts();

        try {
          await hostRef.set(payload);
        } catch (err) {
          showToast('Sync error');
        }
      }

      function startHostHeartbeat() {
        stopHostHeartbeat();
        heartbeatInterval = setInterval(() => {
          if (!isHosting) return;
          db.ref(`${DB_HOSTS_PATH}/${myHostId}`).update({
            name: myHostName,
            peerId: myPeerId || '',
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          }).catch(() => {});
        }, 20000);
      }

      function stopHostHeartbeat() {
        if (heartbeatInterval) {
          clearInterval(heartbeatInterval);
          heartbeatInterval = null;
        }
      }

      async function stopHosting() {
        isHosting = false;
        stopHostHeartbeat();
        localFilesMap.clear();
        hostedCatalogItems = [];
        updateHostingHeaderUI();

        delete latestHostsSnapshot[myHostId];
        if (hostFilterId === myHostId) {
          hostFilterId = 'ALL';
        }
        if (activeSeriesFolder && activeSeriesFolder.hostId === myHostId) {
          activeSeriesFolder = null;
          activeSeriesEpisodes = [];
        }
        reconcileGlobalHosts();

        try {
          if (disconnectRef) {
            await disconnectRef.cancel();
            disconnectRef = null;
          }
          await db.ref(`${DB_HOSTS_PATH}/${myHostId}`).remove();
        } catch (e) {}

        showToast('Stopped hosting');
      }

      window.addEventListener('beforeunload', () => {
        if (isHosting) {

            db.ref(`${DB_HOSTS_PATH}/${myHostId}`).remove();

      });

      /* ============================================================
         7. REAL-TIME FIREBASE GLOBAL CATALOG LISTENER
         ============================================================ */
      db.ref('.info/serverTimeOffset').on('value', (snap) => {
        serverTimeOffsetMs = snap.val() || 0;
      });

      function getServerNowMs() {
        return Date.now() + serverTimeOffsetMs;
      }

      db.ref(DB_HOSTS_PATH).on('value', (snap) => {
        latestHostsSnapshot = snap.val() || {};
        reconcileGlobalHosts();
      });

      setInterval(reconcileGlobalHosts, 15000);

      function reconcileGlobalHosts() {
        const nowMs = getServerNowMs();
        const activeList = [];
        const itemsAcc = [];
        let seq = 0;

        Object.entries(latestHostsSnapshot).forEach(([key, host]) => {
          if (!host || typeof host !== 'object') return;
          const hostId = host.id || key;
          const lastSeen = Number(host.lastSeen || 0);

          // Prune stale disconnected hosts (> 65s since heartbeat)
          if (hostId !== myHostId && lastSeen > 0 && (nowMs - lastSeen) > HOST_TTL_MS) {
            db.ref(`${DB_HOSTS_PATH}/${hostId}`).remove().catch(() => {});
            return;
          }

          const hostName = host.name || hostId;
          const peerId = host.peerId || '';
          const rawItems = Array.isArray(host.items) ? host.items : [];

          activeList.push({
            id: hostId,
            name: hostName,
            peerId,
            itemCount: rawItems.length
          });

          rawItems.forEach((raw) => {
            if (!raw) return;
            const isFolder = raw.type === 'folder';
            const meta = parseMediaMetadata(raw.name, isFolder);

            if (isFolder) {
              const rawEps = Array.isArray(raw.episodes) ? raw.episodes : [];
              const mappedEps = rawEps.map((ep, epIdx) => {
                const epMeta = parseMediaMetadata(ep.name, false);
                return {
                  type: 'file',
                  fileKey: ep.fileKey,
                  name: ep.name,
                  cleanName: epMeta.cleanName,
                  meta: epMeta,
                  releaseYear: epMeta.releaseYear || meta.releaseYear || 0,
                  size: ep.size || 0,
                  bytes: ep.size || 0,
                  sizeLabel: ep.sizeLabel || formatCompactBytes(ep.size || 0),
                  mimeType: ep.mimeType || inferMimeFromName(ep.name),
                  defaultOrder: epIdx,
                  hostId,
                  hostName,
                  peerId
                };
              });

              itemsAcc.push({
                type: 'folder',
                folderKey: raw.folderKey || `dir_${seq}`,
                name: raw.name,
                cleanName: meta.cleanName,
                meta,
                releaseYear: meta.releaseYear,
                count: mappedEps.length,
                size: raw.size || 0,
                bytes: raw.size || 0,
                sizeLabel: raw.sizeLabel || formatCompactBytes(raw.size || 0),
                episodes: mappedEps,
                defaultOrder: seq++,
                hostId,
                hostName,
                peerId
              });
            } else {
              itemsAcc.push({
                type: 'file',
                fileKey: raw.fileKey,
                name: raw.name,
                cleanName: meta.cleanName,
                meta,
                releaseYear: meta.releaseYear,
                size: raw.size || 0,
                bytes: raw.size || 0,
                sizeLabel: raw.sizeLabel || formatCompactBytes(raw.size || 0),
                mimeType: raw.mimeType || inferMimeFromName(raw.name),
                defaultOrder: seq++,
                hostId,
                hostName,
                peerId
              });
            }
          });
        });

        activeList.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        onlineHosts = activeList;
        allRootItems = itemsAcc;

        updateHostDropdown();
        updateGlobalTelemetry();

        // Sync active series folder if open
        if (activeSeriesFolder) {
          const updatedSeries = allRootItems.find(
            (i) => i.type === 'folder' && i.hostId === activeSeriesFolder.hostId && i.name === activeSeriesFolder.name
          );
          if (updatedSeries) {
            activeSeriesFolder = updatedSeries;
            activeSeriesEpisodes = updatedSeries.episodes || [];
          } else {
            activeSeriesFolder = null;
            activeSeriesEpisodes = [];
          }
        }

        renderExplorer();
      }
