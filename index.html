      function getSortDirectionHint() {
        const isAsc = sortDir === 'ASC';
        if (sortField === 'ALPHA') return isAsc ? 'Ascending · A → Z' : 'Descending · Z → A';
        if (sortField === 'SIZE') return isAsc ? 'Ascending · Small → Large' : 'Descending · Large → Small';
        if (sortField === 'DATE') return isAsc ? 'Ascending · Old → New' : 'Descending · New → Old';
        return isAsc ? 'Ascending' : 'Descending';
      }

      function updateSortDirectionUI() {
        const btn = document.getElementById('sortDirBtn');
        const tip = document.getElementById('sortDirTip');
        if (!btn) return;

        if (sortField === 'DEFAULT') {
          btn.classList.remove('visible');
          return;
        }

        btn.classList.add('visible');
        btn.classList.toggle('desc', sortDir === 'DESC');
        const hint = getSortDirectionHint();
        btn.setAttribute('aria-label', hint);
        if (tip) tip.textContent = hint;
      }

      function setSortField(field) {
        const prevField = sortField;
        sortField = field || 'DEFAULT';
        if (prevField === 'DEFAULT' && sortField !== 'DEFAULT') {
          sortDir = 'ASC';
        }
        updateSortDirectionUI();
        renderExplorer();
      }

      function toggleSortDirection() {
        if (sortField === 'DEFAULT') return;
        sortDir = sortDir === 'ASC' ? 'DESC' : 'ASC';
        updateSortDirectionUI();
        renderExplorer();
      }

      function sortMediaCollection(items) {
        const arr = [...items];
        const mult = sortDir === 'ASC' ? 1 : -1;

        switch (sortField) {
          case 'ALPHA':
            arr.sort((a, b) => mult * a.cleanName.localeCompare(b.cleanName, undefined, { numeric: true, sensitivity: 'base' }));
            break;
          case 'SIZE':
            arr.sort((a, b) => {
              const diff = (a.bytes || 0) - (b.bytes || 0);
              return diff !== 0 ? mult * diff : ((a.defaultOrder ?? 0) - (b.defaultOrder ?? 0));
            });
            break;
          case 'DATE':
            arr.sort((a, b) => {
              const ya = a.releaseYear || 0;
              const yb = b.releaseYear || 0;
              if (ya === 0 && yb === 0) return (a.defaultOrder ?? 0) - (b.defaultOrder ?? 0);
              if (ya === 0) return 1;
              if (yb === 0) return -1;
              const diff = ya - yb;
              return diff !== 0 ? mult * diff : ((a.defaultOrder ?? 0) - (b.defaultOrder ?? 0));
            });
            break;
          case 'DEFAULT':
          default:
            arr.sort((a, b) => (a.defaultOrder ?? 0) - (b.defaultOrder ?? 0));
            break;
        }
        return arr;
      }

      function toggleViewMode() {
        viewMode = viewMode === 'grid' ? 'list' : 'grid';
        localStorage.setItem(VIEW_MODE_STORAGE_KEY, viewMode);
        syncViewModeButtonIcon();
        renderExplorer();
      }

      function handleSearchInput(val) {
        searchQuery = val.trim().toLowerCase();
        renderExplorer();
      }

      function openSeriesFolder(seriesItem) {
        activeSeriesFolder = seriesItem;
        activeSeriesEpisodes = Array.isArray(seriesItem.episodes) ? seriesItem.episodes : [];
        renderExplorer();
        const container = document.getElementById('explorerScroll');
        if (container) container.scrollTop = 0;
      }

      function returnToRoot() {
        activeSeriesFolder = null;
        activeSeriesEpisodes = [];
        renderExplorer();
      }

      function progressKey(hostId, fileKey) {
        return `sy_prog_${hostId || 'host'}_${fileKey}`;
      }

      function getSavedProgress(hostId, fileKey) {
        try {
          return JSON.parse(localStorage.getItem(progressKey(hostId, fileKey)) || 'null');
        } catch (e) {
          return null;
        }
      }

      function updateFooterTelemetry(items) {
        const totalBytes = items.reduce((acc, it) => acc + (it.bytes || 0), 0);
        document.getElementById('footerTelemetry').textContent = `${items.length} · ${formatCompactBytes(totalBytes)}`;
        const pct = items.length === 0 ? 0 : Math.min(100, Math.max(12, Math.round((totalBytes / (50 * (1024 ** 3))) * 100)));
        document.getElementById('storageFillBar').style.width = `${pct}%`;
      }

      function renderItemCollection(items, clickFnName, isEpisodeList = false) {
        if (viewMode === 'grid') {
          return `
            <div class="files-grid">
              ${items.map((item, idx) => {
                const epNum = isEpisodeList ? ((item.defaultOrder ?? idx) + 1) : null;
                const meta = item.meta || parseMediaMetadata(item.name, item.type === 'folder');
                const specPills = meta.specs.slice(0, 3).map((sp) => `<span class="spec-pill mono">${escapeHtml(sp)}</span>`).join('');
                const fileBadge = item.type === 'folder'
                  ? `${item.count || 0} EP · ${item.sizeLabel}`
                  : `${meta.ext || 'VID'} · ${item.sizeLabel}`;

                return `
                  <div class="file-tile" role="button" tabindex="0" onclick="${clickFnName}(${idx})">
                    <div class="thumb-frame">
                      ${buildCodedThumbnailSvg(item, epNum)}
                    </div>
                    <div class="tile-body">
                      <div class="tile-name" title="${escapeHtml(item.name)}">${escapeHtml(item.cleanName)}</div>
                      ${specPills ? `<div class="tile-tags">${specPills}</div>` : ''}
                      <div class="tile-meta">
                        <span class="host-tag">${renderSignalBarsHtml(3)}<span>${escapeHtml(item.hostName)}</span></span>
                        <span class="mono">${escapeHtml(fileBadge)}</span>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }

        return `
          <div class="oneui-list-card">
            ${items.map((item, idx) => {
              const epNum = isEpisodeList ? ((item.defaultOrder ?? idx) + 1) : null;
              const meta = item.meta || parseMediaMetadata(item.name, item.type === 'folder');
              const specPills = meta.specs.slice(0, 3).map((sp) => `<span class="spec-pill mono">${escapeHtml(sp)}</span>`).join('');
              const fileBadge = item.type === 'folder'
                ? `${item.count || 0} EP · ${item.sizeLabel}`
                : `${meta.ext || 'VID'} · ${item.sizeLabel}`;

              return `
                <div class="oneui-row" role="button" tabindex="0" onclick="${clickFnName}(${idx})">
                  <div class="row-thumb">
                    ${buildCodedThumbnailSvg(item, epNum)}
                  </div>
                  <div class="row-info">
                    <div class="row-name" title="${escapeHtml(item.name)}">${escapeHtml(item.cleanName)}</div>
                    <div class="row-sub">
                      <span class="host-tag">${renderSignalBarsHtml(3)}<span>${escapeHtml(item.hostName)}</span></span>
                      ${specPills}
                      <span class="mono">${escapeHtml(fileBadge)}</span>
                    </div>
                  </div>
                  <div class="row-chevron">${item.type === 'folder' ? '›' : '▶'}</div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      function renderExplorer() {
        const container = document.getElementById('explorerScroll');
        const filterBar = document.getElementById('filterBar');

        if (onlineHosts.length === 0 || allRootItems.length === 0) {
          filterBar.style.display = 'none';
          updateFooterTelemetry([]);
          container.innerHTML = `
            <div class="empty-card">
              <h3>No Hosts Online</h3>
              <p>Select a folder on PC or phone to share movies and series.</p>
              <div style="display:flex; align-items:center; justify-content:center; gap:8px;">
                <div class="morph-btn accent" role="button" tabindex="0" onclick="triggerFolderPicker()">Select Folder</div>
                <div class="morph-btn" role="button" tabindex="0" onclick="triggerFilesPicker()">Files</div>
              </div>
            </div>
          `;
          return;
        }

        filterBar.style.display = 'flex';
        updateSortDirectionUI();

        // 1. Inside a Series Folder
        if (activeSeriesFolder) {
          const s = activeSeriesFolder;
          const filteredEps = sortMediaCollection(
            activeSeriesEpisodes.filter((ep) => {
              if (searchQuery && !ep.cleanName.toLowerCase().includes(searchQuery) && !ep.name.toLowerCase().includes(searchQuery)) return false;
              return true;
            })
          );
          window._visibleEpisodes = filteredEps;
          updateFooterTelemetry(filteredEps);

          let html = `
            <div class="series-head-card">
              <div class="series-head-left">
                <div class="morph-btn icon-sq" role="button" tabindex="0" onclick="returnToRoot()" title="Back">←</div>
                <div class="series-head-thumb">${buildCodedThumbnailSvg(s)}</div>
                <div style="min-width:0;">
                  <div class="section-heading" style="font-size:16px;">${escapeHtml(s.cleanName)}</div>
                  <div class="row-sub" style="margin-top:5px;">
                    <span class="host-tag">${renderSignalBarsHtml(3)}<span>${escapeHtml(s.hostName)}</span></span>
                    <span class="mono">${activeSeriesEpisodes.length} EP · ${escapeHtml(s.sizeLabel)}</span>
                  </div>
                </div>
              </div>
              ${filteredEps.length > 0 ? `
                <div class="morph-btn accent" role="button" tabindex="0" onclick="handleVisibleEpisodeClick(0)">▶ Play</div>
              ` : ''}
            </div>
          `;

          if (filteredEps.length === 0) {
            html += `<div class="empty-card"><h3>Empty</h3><p>No matching episodes.</p></div>`;
          } else {
            html += renderItemCollection(filteredEps, 'handleVisibleEpisodeClick', true);
          }
          container.innerHTML = html;
          return;
        }

        // 2. Root Explorer: Separated Series & Movies across all online hosts
        const matching = allRootItems.filter((item) => {
          if (hostFilterId !== 'ALL' && item.hostId !== hostFilterId) return false;
          if (
            searchQuery &&
            !item.cleanName.toLowerCase().includes(searchQuery) &&
            !item.name.toLowerCase().includes(searchQuery) &&
            !item.hostName.toLowerCase().includes(searchQuery)
          ) {
            return false;
          }
          return true;
        });

        const seriesList = sortMediaCollection(matching.filter((i) => i.type === 'folder'));
        const moviesList = sortMediaCollection(matching.filter((i) => i.type === 'file'));

        window._visibleSeries = seriesList;
        window._visibleMovies = moviesList;

        const showSeries = typeFilter === 'ALL' || typeFilter === 'SERIES';
        const showMovies = typeFilter === 'ALL' || typeFilter === 'MOVIES';

        const visibleItems = [
          ...(showSeries ? seriesList : []),
          ...(showMovies ? moviesList : [])
        ];
        updateFooterTelemetry(visibleItems);

        if (visibleItems.length === 0) {
          container.innerHTML = `<div class="empty-card"><h3>No Matches</h3><p>Adjust search or filter selection.</p></div>`;
          return;
        }

        let html = '';

        if (showSeries && seriesList.length > 0) {
          html += `
            <section class="category-section">
              <div class="section-header">
                <div class="section-title-group">
                  <span class="section-heading">Series</span>
                  <span class="count-badge mono">${seriesList.length}</span>
                </div>
              </div>
              ${renderItemCollection(seriesList, 'handleSeriesClick', false)}
            </section>
          `;
        }

        if (showMovies && moviesList.length > 0) {
          html += `
            <section class="category-section">
              <div class="section-header">
                <div class="section-title-group">
                  <span class="section-heading">Movies</span>
                  <span class="count-badge mono">${moviesList.length}</span>
                </div>
              </div>
              ${renderItemCollection(moviesList, 'handleMovieClick', false)}
            </section>
          `;
        }

        container.innerHTML = html;
      }

      function handleSeriesClick(idx) {
        const series = window._visibleSeries[idx];
        if (series) openSeriesFolder(series);
      }

      function handleMovieClick(idx) {
        const movie = window._visibleMovies[idx];
        if (!movie) return;
        activePlayerList = [movie];
        openMediaAtIndex(0, false);
      }

      function handleVisibleEpisodeClick(idx) {
        const list = (window._visibleEpisodes && window._visibleEpisodes.length > 0)
          ? window._visibleEpisodes
          : activeSeriesEpisodes;
        if (!list.length) return;
        activePlayerList = list;
        openMediaAtIndex(Math.min(Math.max(0, idx), list.length - 1), false);
      }

      /* ============================================================
         9. ZERO-LAG DUAL-PIPELINE P2P VIDEO STREAMER & CINEMA PLAYER
         ============================================================ */
      function isPlayingSeriesFolder() {
        return activeSeriesFolder !== null && Array.isArray(activePlayerList) && activePlayerList.length > 1;
      }

      function updateEpisodeNavigationUI() {
        const showSeriesUI = isPlayingSeriesFolder();
        const prevBtn = document.getElementById('prevEpBtn');
        const nextBtn = document.getElementById('nextEpBtn');
        const epPane = document.getElementById('episodePane');
        const workspace = document.getElementById('playerWorkspace');

        if (!showSeriesUI) {
          prevBtn.style.display = 'none';
          nextBtn.style.display = 'none';
          epPane.classList.remove('show');
          workspace.classList.add('no-episodes');
          return;
        }

        prevBtn.style.display = 'inline-flex';
        nextBtn.style.display = 'inline-flex';
        prevBtn.classList.toggle('disabled', activeIndex <= 0);
        nextBtn.classList.toggle('disabled', activeIndex >= activePlayerList.length - 1);

        epPane.classList.add('show');
        workspace.classList.remove('no-episodes');

        document.getElementById('epPaneTitle').textContent = activeSeriesFolder.cleanName;
        document.getElementById('epPaneCount').textContent = `${activeIndex + 1}/${activePlayerList.length}`;

        const listEl = document.getElementById('epList');
        listEl.innerHTML = activePlayerList.map((f, i) => {
          const isCur = i === activeIndex;
          const meta = f.meta || parseMediaMetadata(f.name, false);
          const dispNum = (f.defaultOrder ?? i) + 1;
          return `
            <div class="ep-card ${isCur ? 'active' : ''}" id="epCard_${i}" role="button" tabindex="0" onclick="selectEpisode(${i})">
              <div class="ep-num mono">${String(dispNum).padStart(2, '0')}</div>
              <div class="ep-info">
                <div class="ep-name" title="${escapeHtml(f.name)}">${escapeHtml(f.cleanName)}</div>
                <div class="ep-meta mono">
                  <span>${escapeHtml(meta.res || meta.ext || 'VID')}</span>
                  <span>•</span>
                  <span>${escapeHtml(f.sizeLabel)}</span>
                </div>
              </div>
            </div>
          `;
        }).join('');

        requestAnimationFrame(() => {
          const activeCard = document.getElementById(`epCard_${activeIndex}`);
          if (activeCard) {
            activeCard.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        });
      }

      function selectEpisode(idx) {
        if (idx === activeIndex) return;
        openMediaAtIndex(idx, false);
      }

      function playPrevEpisode() {
        if (!isPlayingSeriesFolder() || activeIndex <= 0) return;
        openMediaAtIndex(activeIndex - 1, false);
      }

      function playNextEpisode() {
        if (!isPlayingSeriesFolder() || activeIndex >= activePlayerList.length - 1) return;
        openMediaAtIndex(activeIndex + 1, false);
      }

      function setLoader(show) {
        document.getElementById('loaderBox').classList.toggle('show', show);
      }

      function updateQualityBadge(label) {
        document.getElementById('qualityBadge').textContent = label || 'HD';
      }

      function getActiveVideo() {
        return document.getElementById('videoEl');
      }

      function createFreshVideoElement() {
        teardownActiveP2PStream();

        const stage = document.getElementById('videoStage');
        const oldVideo = document.getElementById('videoEl');
        if (oldVideo) {
          try { oldVideo.pause(); } catch (e) {}
          oldVideo.removeAttribute('src');
          oldVideo.load();
          oldVideo.remove();
        }

        const freshVideo = document.createElement('video');
        freshVideo.id = 'videoEl';
        freshVideo.setAttribute('playsinline', '');
        freshVideo.setAttribute('webkit-playsinline', '');
        freshVideo.setAttribute('preload', 'auto');
        freshVideo.volume = isMuted ? 0 : savedVol;
        freshVideo.muted = isMuted;

        const fsExitBtn = document.getElementById('fsExitBtn');
        stage.insertBefore(freshVideo, fsExitBtn);
        attachVideoEvents(freshVideo);
        return freshVideo;
      }

      function attachVideoEvents(video) {
        video.addEventListener('loadedmetadata', () => {
          if (isFinite(video.duration) && video.duration > 0) {
            activeDuration = video.duration;
          }
          if (video.videoHeight > 0) {
            const h = video.videoHeight;
            const label = h >= 2160 ? '4K' : (h >= 1440 ? '2K' : (h >= 1080 ? '1080p' : (h >= 720 ? '720p' : (h >= 480 ? '480p' : `${h}p`))));
            updateQualityBadge(label);
          }
        });

        video.addEventListener('playing', () => {
          setLoader(false);
          document.getElementById('playBtn').textContent = 'Pause';
        });

        video.addEventListener('canplay', () => {
          setLoader(false);
        });

        video.addEventListener('pause', () => {
          document.getElementById('playBtn').textContent = 'Play';
        });

        video.addEventListener('waiting', () => {
          setLoader(true);
        });

        video.addEventListener('ended', () => {
          if (isPlayingSeriesFolder() && activeIndex < activePlayerList.length - 1) {
            playNextEpisode();
          }
        });

        video.addEventListener('timeupdate', () => {
          const total = getTotalMediaDuration();
          const current = video.currentTime || 0;
          document.getElementById('clockText').textContent = `${formatClock(current)} / ${total > 0 ? formatClock(total) : '--:--'}`;

          if (total > 0) {
            const pct = Math.min(100, Math.max(0, (current / total) * 100));
            document.getElementById('seekProgress').style.width = `${pct}%`;
          }

          if (activeMedia && Math.abs(current - lastSavedTick) >= 5) {
            lastSavedTick = current;
            localStorage.setItem(progressKey(activeMedia.hostId, activeMedia.fileKey), JSON.stringify({ pos: current, dur: total }));
          }
        });
      }

      attachVideoEvents(getActiveVideo());

      function teardownActiveP2PStream() {
        if (activeStreamController) {
          try { activeStreamController.destroy(); } catch (e) {}
          activeStreamController = null;
        }
        if (activeBlobUrl) {
          try { URL.revokeObjectURL(activeBlobUrl); } catch (e) {}
          activeBlobUrl = null;
        }
      }

      async function openMediaAtIndex(idx, forceStartZero = false) {
        const item = activePlayerList[idx];
        if (!item) return;

        unlockMobileOrientation();
        syncViewportLayout();

        activeIndex = idx;
        activeMedia = item;
        activeDuration = 0;
        lastSavedTick = 0;

        let initialStart = 0;
        if (!forceStartZero) {
          const saved = getSavedProgress(item.hostId, item.fileKey);
          if (saved && saved.pos > 15 && (!saved.dur || saved.pos < saved.dur - 30)) {
            initialStart = Math.floor(saved.pos);
            activeDuration = saved.dur || 0;
          }
        }
        streamOffsetSec = initialStart;

        const screenEl = document.getElementById('playerScreen');
        isFullscreenMode = false;
        document.documentElement.classList.remove('fs-lock');
        document.body.classList.remove('fs-lock');
        screenEl.classList.remove('fs-active', 'fs-rotate-fallback');

        document.getElementById('playerName').textContent = item.cleanName;
        document.getElementById('seekProgress').style.width = '0%';
        document.getElementById('clockText').textContent = '00:00 / --:--';
        hideSeekHoverPreview();
        updateQualityBadge((item.meta && item.meta.res) || 'HD');

        updateEpisodeNavigationUI();
        setLoader(true);
        screenEl.classList.add('open');

        const video = createFreshVideoElement();

        // Case A: Local Host Instant Playback
        if (item.hostId === myHostId && localFilesMap.has(item.fileKey)) {
          const localFile = localFilesMap.get(item.fileKey);
          activeBlobUrl = URL.createObjectURL(localFile);
          video.src = activeBlobUrl;
          video.playbackRate = activeSpeed;
          if (initialStart > 0) {
            video.addEventListener('loadedmetadata', () => {
              if (initialStart < video.duration - 5) {
                video.currentTime = initialStart;
              }
            }, { once: true });
          }
          video.play().catch(() => {});
          return;
        }

        // Case B: Remote P2P WebRTC Dual-Pipeline Streamer
        startRemoteP2PStream(item, video, initialStart);
      }

      /**
       * Dual-Pipeline P2P Streamer:
       * 1) Progressive Fragmented MP4 via MP4Box.js + MediaSource (SourceBuffer) with byte-range seeking
       * 2) High-throughput windowed binary chunk transfer + progressive Blob fallback for MKV/AVI/WebM
       */
      function startRemoteP2PStream(item, video, initialStartSec) {
        if (!peer || !item.peerId) {
          setLoader(false);
          showToast('Host offline');
          return;
        }

        const ext = ((item.meta && item.meta.ext) || item.name.split('.').pop() || '').toLowerCase();
        const isIsoBmffCandidate = ['mp4', 'm4v', 'mov'].includes(ext) &&
          typeof MP4Box !== 'undefined' &&
          'MediaSource' in window;

        const conn = peer.connect(item.peerId, {
          reliable: true,
          serialization: 'binary'
        });

        let destroyed = false;
        let currentStreamToken = (Math.floor(Math.random() * 0x7fffffff) + 1) >>> 0;
        let totalFileSize = item.size || 0;
        let streamMime = item.mimeType || inferMimeFromName(item.name);

        // MP4Box + MSE State
        let mseMode = isIsoBmffCandidate;
        let mediaSource = null;
        let mp4boxfile = null;
        const sourceBuffers = new Map(); // trackId -> { sb, queue }
        let mseInitialized = false;
        let pendingSeekSec = initialStartSec > 0 ? initialStartSec : null;
        let expectedNextByte = 0;

        // Blob Fallback State
        const fallbackChunks = [];
        let fallbackReceivedBytes = 0;
        let fallbackApplied = false;

        function nextToken() {
          currentStreamToken = ((currentStreamToken + 1) & 0x7fffffff) || 1;
          return currentStreamToken;
        }

        function requestByteRange(startByte, endByte = null) {
          if (destroyed || !conn.open) return;
          const token = nextToken();
          expectedNextByte = startByte;
          conn.send({
            type: 'REQUEST_RANGE',
            streamToken: token,
            fileKey: item.fileKey,
            startByte,
            endByte
          });
          return token;
        }

        function switchToBlobFallback() {
          if (!mseMode || destroyed) return;
          mseMode = false;
          try {
            if (activeBlobUrl) URL.revokeObjectURL(activeBlobUrl);
          } catch (e) {}
          activeBlobUrl = null;
          sourceBuffers.clear();
          fallbackChunks.length = 0;
          fallbackReceivedBytes = 0;
          fallbackApplied = false;

          // Restart clean full-file windowed binary transfer from byte 0
          if (conn.open) {
            conn.send({ type: 'CANCEL_RANGE', streamToken: currentStreamToken });
            requestByteRange(0, null);
          }
        }

        function applyFallbackBlob(isFinal) {
          if (destroyed || fallbackChunks.length === 0) return;
          const prevTime = video.currentTime || 0;
          const wasPaused = video.paused;
          if (activeBlobUrl) {
            try { URL.revokeObjectURL(activeBlobUrl); } catch (e) {}
          }
          const blob = new Blob(fallbackChunks, { type: streamMime });
          activeBlobUrl = URL.createObjectURL(blob);
          video.src = activeBlobUrl;
          video.playbackRate = activeSpeed;
          const targetT = prevTime > 0.5 ? prevTime : (initialStartSec > 0 ? initialStartSec : 0);
          if (targetT > 0) {
            video.addEventListener('loadedmetadata', () => {
              if (targetT < (video.duration || 0) - 3) video.currentTime = targetT;
            }, { once: true });
          }
          if (!wasPaused || isFinal) {
            video.play().catch(() => {});
          }
          setLoader(false);
          fallbackApplied = true;
        }

        function flushSourceBuffer(trackId) {
          const entry = sourceBuffers.get(trackId);
          if (!entry || !entry.sb || entry.sb.updating || entry.queue.length === 0) return;
          if (!mediaSource || mediaSource.readyState !== 'open') return;
          try {
            const seg = entry.queue.shift();
            entry.sb.appendBuffer(seg);
          } catch (err) {
            if (err && err.name === 'QuotaExceededError') {
              // Evict already-watched buffer behind playhead
              const cur = video.currentTime || 0;
              if (cur > 20) {
                try {
                  entry.sb.remove(0, cur - 10);
                  return;
                } catch (e) {}
              }
            }
            switchToBlobFallback();
          }
        }

        function initMsePipeline() {
          try {
            mediaSource = new MediaSource();
            activeBlobUrl = URL.createObjectURL(mediaSource);
            video.src = activeBlobUrl;
            video.playbackRate = activeSpeed;

            mp4boxfile = MP4Box.createFile();

            mp4boxfile.onError = () => {
              switchToBlobFallback();
            };

            mp4boxfile.onReady = (info) => {
              if (destroyed || !mseMode) return;
              if (info.duration && info.timescale) {
                activeDuration = info.duration / info.timescale;
              }

              const tracksToUse = [];
              if (info.videoTracks && info.videoTracks.length > 0) {
                tracksToUse.push(info.videoTracks[0]);
              }
              if (info.audioTracks && info.audioTracks.length > 0) {
                tracksToUse.push(info.audioTracks[0]);
              }

              if (tracksToUse.length === 0) {
                switchToBlobFallback();
                return;
              }

              const attachTracks = () => {
                if (destroyed || !mseMode || mseInitialized) return;
                if (mediaSource.readyState !== 'open') return;
                mseInitialized = true;

                try {
                  if (activeDuration > 0 && isFinite(activeDuration)) {
                    mediaSource.duration = activeDuration;
                  }

                  for (const track of tracksToUse) {
                    const mimeCodec = `video/mp4; codecs="${track.codec}"`;
                    const audioMimeCodec = `audio/mp4; codecs="${track.codec}"`;
                    const chosenMime = track.type === 'audio'
                      ? (MediaSource.isTypeSupported(audioMimeCodec) ? audioMimeCodec : mimeCodec)
                      : mimeCodec;

                    if (!MediaSource.isTypeSupported(chosenMime)) {
                      switchToBlobFallback();
                      return;
                    }

                    const sb = mediaSource.addSourceBuffer(chosenMime);
                    sourceBuffers.set(track.id, { sb, queue: [] });
                    sb.addEventListener('updateend', () => flushSourceBuffer(track.id));
                    mp4boxfile.setSegmentOptions(track.id, sb, { nbSamples: 60 });
                  }

                  const initSegs = mp4boxfile.initializeSegmentation();
                  initSegs.forEach((initSeg) => {
                    const entry = sourceBuffers.get(initSeg.id);
                    if (entry) {
                      entry.queue.push(initSeg.buffer);
                      flushSourceBuffer(initSeg.id);
                    }
                  });

                  mp4boxfile.start();

                  if (pendingSeekSec !== null && pendingSeekSec > 2) {
                    const s = pendingSeekSec;
                    pendingSeekSec = null;
                    seekMseStream(s);
                  } else {
                    video.play().catch(() => {});
                  }
                } catch (err) {
                  switchToBlobFallback();
                }
              };

              if (mediaSource.readyState === 'open') {
                attachTracks();
              } else {
                mediaSource.addEventListener('sourceopen', attachTracks, { once: true });
              }
            };

            mp4boxfile.onSegment = (id, user, buffer, sampleNumber, last) => {
              if (destroyed || !mseMode) return;
              const entry = sourceBuffers.get(id);
              if (entry) {
                entry.queue.push(buffer);
                flushSourceBuffer(id);
              }
              mp4boxfile.releaseUsedSamples(id, sampleNumber);
              if (video.paused && video.readyState >= 2) {
                video.play().catch(() => {});
              }
            };
          } catch (e) {
            switchToBlobFallback();
          }
        }

        function seekMseStream(targetSec) {
          if (!mseMode || !mp4boxfile || !mseInitialized) return false;
          setLoader(true);
          try {
            const seekInfo = mp4boxfile.seek(targetSec, true);
            if (!seekInfo || typeof seekInfo.offset !== 'number') return false;

            // Cancel previous stream and flush pending source buffers
            conn.send({ type: 'CANCEL_RANGE', streamToken: currentStreamToken });
            sourceBuffers.forEach((entry) => {
              entry.queue.length = 0;
              if (!entry.sb.updating && mediaSource && mediaSource.readyState === 'open') {
                try { entry.sb.abort(); } catch (e) {}
              }
            });

            video.currentTime = seekInfo.time || targetSec;
            requestByteRange(seekInfo.offset, null);
            return true;
          } catch (err) {
            return false;
          }
        }

        if (mseMode) {
          initMsePipeline();
        }

        conn.on('open', () => {
          if (destroyed) return;
          requestByteRange(0, null);
        });

        conn.on('data', (packet) => {
          if (destroyed) return;

          // Binary Frame: [uint32 streamToken, float64 byteOffset, ...payload]
          if (packet instanceof ArrayBuffer || ArrayBuffer.isView(packet)) {
            const rawBuf = packet instanceof ArrayBuffer
              ? packet
              : packet.buffer.slice(packet.byteOffset, packet.byteOffset + packet.byteLength);

            if (rawBuf.byteLength <= 12) return;
            const headerView = new DataView(rawBuf);
            const pktToken = headerView.getUint32(0, true);
            const byteOffset = headerView.getFloat64(4, true);

            if (pktToken !== currentStreamToken) return;

            const chunkSlice = rawBuf.slice(12);
            const nextOffset = byteOffset + chunkSlice.byteLength;

            // Send sliding window acknowledgment every 2 MB
            if (conn.open && (nextOffset - expectedNextByte >= 2 * 1024 * 1024 || nextOffset >= totalFileSize)) {
              expectedNextByte = nextOffset;
              conn.send({
                type: 'WINDOW_ACK',
                streamToken: pktToken,
                ackOffset: nextOffset
              });
            }

            if (mseMode && mp4boxfile) {
              try {
                chunkSlice.fileStart = byteOffset;
                const nextNeededOffset = mp4boxfile.appendBuffer(chunkSlice);
                // If moov atom is located at the end of the file, jump immediately to fetch moov
                if (!mseInitialized && typeof nextNeededOffset === 'number' && nextNeededOffset > nextOffset + CHUNK_SIZE) {
                  conn.send({ type: 'CANCEL_RANGE', streamToken: currentStreamToken });
                  requestByteRange(nextNeededOffset, null);
                }
              } catch (err) {
                switchToBlobFallback();
              }
            } else {
              fallbackChunks.push(chunkSlice);
              fallbackReceivedBytes += chunkSlice.byteLength;
              if (!fallbackApplied && fallbackReceivedBytes >= 6 * 1024 * 1024 && ext === 'webm') {
                applyFallbackBlob(false);
              }
            }
            return;
          }

          // JSON Control Frame
          if (packet && typeof packet === 'object') {
            if (packet.type === 'RANGE_META') {
              if (packet.streamToken !== currentStreamToken) return;
              totalFileSize = packet.totalSize || totalFileSize;
              streamMime = packet.mimeType || streamMime;
              return;
            }

            if (packet.type === 'RANGE_END') {
              if (packet.streamToken !== currentStreamToken) return;
              if (mseMode && mp4boxfile) {
                try { mp4boxfile.flush(); } catch (e) {}
                // If moov was at EOF and now ready, stream movie body from byte 0 (or seek offset)
                if (mseInitialized && expectedNextByte > totalFileSize * 0.5 && video.currentTime < 1) {
                  requestByteRange(0, null);
                } else if (mediaSource && mediaSource.readyState === 'open') {
                  const tryEnd = () => {
                    let anyUpdating = false;
                    sourceBuffers.forEach((entry) => {
                      if (entry.sb.updating || entry.queue.length > 0) anyUpdating = true;
                    });
                    if (!anyUpdating && mediaSource.readyState === 'open') {
                      try { mediaSource.endOfStream(); } catch (e) {}
                    } else if (!destroyed) {
                      setTimeout(tryEnd, 120);
                    }
                  };
                  tryEnd();
                }
              } else if (!fallbackApplied) {
                applyFallbackBlob(true);
              }
              return;
            }

            if (packet.type === 'RANGE_ERROR') {
              if (packet.streamToken !== currentStreamToken) return;
              setLoader(false);
              showToast(packet.message || 'Stream error');
            }
          }
        });

        conn.on('error', () => {
          if (!destroyed) {
            setLoader(false);
            showToast('Host unreachable');
          }
        });

        conn.on('close', () => {
          if (!destroyed && !mseMode && !fallbackApplied && fallbackChunks.length > 0) {
            applyFallbackBlob(false);
          }
        });

        activeStreamController = {
          seekTo(targetSec) {
            if (mseMode && mseInitialized) {
              return seekMseStream(targetSec);
            }
            return false;
          },
          destroy() {
            destroyed = true;
            try {
              if (conn.open) {
                conn.send({ type: 'CANCEL_RANGE', streamToken: currentStreamToken });
              }
              conn.close();
            } catch (e) {}
            sourceBuffers.clear();
          }
        };
      }

      /* ============================================================
         10. SEEKBAR EXACT HH:MM:SS HOVER PREVIEW & PLAYBACK CONTROLS
         ============================================================ */
      function getTotalMediaDuration() {
        const video = getActiveVideo();
        if (video && isFinite(video.duration) && video.duration > 0) {
          return video.duration;
        }
        return activeDuration || 0;
      }

      function updateSeekHoverPreview(clientX) {
        const seekArea = document.getElementById('seekArea');
        const tooltip = document.getElementById('seekTooltip');
        const hoverFill = document.getElementById('seekHoverFill');
        const total = getTotalMediaDuration();
        if (!seekArea || !tooltip || !total || total <= 0) return;

        const rect = seekArea.getBoundingClientRect();
        if (rect.width <= 0) return;

        const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        const targetSec = ratio * total;

        tooltip.textContent = formatExactHMS(targetSec);
        hoverFill.style.width = `${(ratio * 100).toFixed(2)}%`;
        seekArea.classList.add('hovering');

        const halfW = (tooltip.offsetWidth || 66) / 2;
        const rawPx = ratio * rect.width;
        const clampedPx = Math.min(Math.max(halfW, rawPx), Math.max(halfW, rect.width - halfW));
        tooltip.style.left = `${clampedPx}px`;
      }

      function hideSeekHoverPreview() {
        const seekArea = document.getElementById('seekArea');
        if (seekArea) {
          seekArea.classList.remove('hovering');
        }
      }

      (function initSeekbarHoverListeners() {
        const seekArea = document.getElementById('seekArea');
        if (!seekArea) return;

        seekArea.addEventListener('mousemove', (e) => {
          updateSeekHoverPreview(e.clientX);
        }, { passive: true });

        seekArea.addEventListener('mouseleave', () => {
          hideSeekHoverPreview();
        }, { passive: true });

        seekArea.addEventListener('touchstart', (e) => {
          if (e.touches && e.touches.length > 0) {
            updateSeekHoverPreview(e.touches[0].clientX);
          }
        }, { passive: true });

        seekArea.addEventListener('touchmove', (e) => {
          if (e.touches && e.touches.length > 0) {
            updateSeekHoverPreview(e.touches[0].clientX);
          }
        }, { passive: true });

        seekArea.addEventListener('touchend', () => {
          hideSeekHoverPreview();
        }, { passive: true });

        seekArea.addEventListener('touchcancel', () => {
          hideSeekHoverPreview();
        }, { passive: true });
      })();

      function jumpToPosition(targetSec) {
        const video = getActiveVideo();
        if (!video) return;

        // Check if target timestamp is already inside buffered ranges
        if (video.buffered && video.buffered.length > 0) {
          for (let i = 0; i < video.buffered.length; i++) {
            if (targetSec >= video.buffered.start(i) && targetSec <= video.buffered.end(i)) {
              video.currentTime = targetSec;
              return;
            }
          }
        }

        // If active P2P MP4Box MSE stream supports byte-range keyframe seek, trigger it
        if (activeStreamController && activeStreamController.seekTo(targetSec)) {
          return;
        }

        // Otherwise clamp inside currently seekable range
        if (video.seekable && video.seekable.length > 0) {
          const maxSeek = video.seekable.end(video.seekable.length - 1);
          video.currentTime = Math.min(Math.max(0, targetSec), maxSeek);
        }
      }

      function seekFromBar(e) {
        const total = getTotalMediaDuration();
        if (!total || total <= 0) return;
        const rect = document.getElementById('seekArea').getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        jumpToPosition(ratio * total);
      }

      function skipBy(delta) {
        const video = getActiveVideo();
        const total = getTotalMediaDuration();
        const current = video ? (video.currentTime || 0) : 0;
        const target = Math.max(0, total > 0 ? Math.min(total - 1, current + delta) : current + delta);
        jumpToPosition(target);
      }

      function togglePlayPause() {
        const video = getActiveVideo();
        if (!video) return;
        if (video.paused) video.play().catch(() => {});
        else video.pause();
      }

      function setVolume(val) {
        const num = Number(val);
        const video = getActiveVideo();
        isMuted = num === 0;
        if (num > 0) savedVol = num;
        if (video) {
          video.volume = num;
          video.muted = isMuted;
        }
        updateVolumeIcon();
      }

      function toggleMute() {
        const video = getActiveVideo();
        if (isMuted || savedVol === 0) {
          isMuted = false;
          savedVol = savedVol || 1;
          document.getElementById('volRange').value = String(savedVol);
          if (video) {
            video.muted = false;
            video.volume = savedVol;
          }
        } else {
          isMuted = true;
          document.getElementById('volRange').value = '0';
          if (video) {
            video.muted = true;
          }
        }
        updateVolumeIcon();
      }

      function updateVolumeIcon() {
        const icon = document.getElementById('volIcon');
        if (isMuted || savedVol === 0) {
          icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`;
        } else {
          icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>`;
        }
      }

      function closePlayer() {
        exitFullscreenMode(false);
        closeModal();
        createFreshVideoElement();
        activeMedia = null;
        setLoader(false);
        document.getElementById('playerScreen').classList.remove('open');
        renderExplorer();
      }

      /* ============================================================
         11. PLAYER OPTIONS & SPEED POPUP SHEETS
         ============================================================ */
      function openPlayerOverflowMenu() {
        document.getElementById('modalTitle').textContent = 'Options';
        const list = document.getElementById('modalList');
        list.innerHTML = `
          <div class="modal-option" role="button" tabindex="0" onclick="restartFromZero()">
            <div class="opt-main">
              <div class="opt-title">Restart</div>
              <div class="opt-sub">Play from 00:00</div>
            </div>
            <span class="mono" style="color:#8bbce8; font-weight:800;">↺</span>
          </div>
          <div class="modal-option" role="button" tabindex="0" onclick="reloadCurrentStream()">
            <div class="opt-main">
              <div class="opt-title">Reload Stream</div>
              <div class="opt-sub">Reconnect P2P stream</div>
            </div>
            <span class="mono" style="color:#8bbce8; font-weight:800;">↻</span>
          </div>
        `;
        document.getElementById('modalBackdrop').classList.add('open');
      }

      function restartFromZero() {
        closeModal();
        openMediaAtIndex(activeIndex, true);
      }

      function reloadCurrentStream() {
        closeModal();
        openMediaAtIndex(activeIndex, false);
      }

      function openSpeedPopup() {
        document.getElementById('modalTitle').textContent = 'Speed';
        const list = document.getElementById('modalList');
        list.innerHTML = SPEED_OPTIONS.map((opt) => `
          <div class="modal-option ${opt.value === activeSpeed ? 'selected' : ''}" role="button" tabindex="0" onclick="selectPlaybackSpeed(${opt.value})">
            <div class="opt-main">
              <div class="opt-title">${escapeHtml(opt.label)}</div>
              <div class="opt-sub">${escapeHtml(opt.sub)}</div>
            </div>
            <div class="opt-check">✓</div>
          </div>
        `).join('');
        document.getElementById('modalBackdrop').classList.add('open');
      }

      function selectPlaybackSpeed(val) {
        closeModal();
        activeSpeed = val;
        const video = getActiveVideo();
        if (video) video.playbackRate = val;
        document.getElementById('speedBtn').textContent = `${val}x`;
      }

      function closeModal() {
        document.getElementById('modalBackdrop').classList.remove('open');
      }

      /* ============================================================
         12. EXCLUSIVE EDGE-TO-EDGE FULLSCREEN MODE
         ============================================================ */
      function getFullViewportDims() {
        const w = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0);
        const h = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
        return { w, h };
      }

      function syncViewportLayout() {
        document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
        if (window.scrollY !== 0 || window.scrollX !== 0) {
          window.scrollTo(0, 0);
        }
        if (isFullscreenMode) {
          updateFullscreenRotationFallback();
        }
      }

      function updateFullscreenRotationFallback() {
        const screenEl = document.getElementById('playerScreen');
        const stageEl = document.getElementById('videoStage');
        if (!isFullscreenMode) {
          screenEl.classList.remove('fs-rotate-fallback');
          stageEl.style.width = '';
          stageEl.style.height = '';
          return;
        }

        const { w, h } = getFullViewportDims();
        const isPortraitViewport = h > w;
        const needsRotateFallback = !orientationLockedByPlayer && isPortraitViewport;
        screenEl.classList.toggle('fs-rotate-fallback', needsRotateFallback);

        if (needsRotateFallback) {
          stageEl.style.width = `${h}px`;
          stageEl.style.height = `${w}px`;
        } else {
          stageEl.style.width = '';
          stageEl.style.height = '';
        }
      }

      function unlockMobileOrientation() {
        orientationLockedByPlayer = false;
        try {
          if (screen.orientation && typeof screen.orientation.unlock === 'function') {
            screen.orientation.unlock();
          }
        } catch (e) {}
      }

      function setFsExitButtonVisible(visible) {
        fsButtonVisible = Boolean(visible);
        const exitBtn = document.getElementById('fsExitBtn');
        if (exitBtn) {
          exitBtn.classList.toggle('fs-hidden', !fsButtonVisible);
        }
      }

      function enterFullscreenMode() {
        if (!activeMedia) return;
        isFullscreenMode = true;

        document.documentElement.classList.add('fs-lock');
        document.body.classList.add('fs-lock');

        const screenEl = document.getElementById('playerScreen');
        screenEl.classList.add('fs-active');
        setFsExitButtonVisible(true);

        const reqFs = screenEl.requestFullscreen || screenEl.webkitRequestFullscreen || screenEl.msRequestFullscreen;
        if (typeof reqFs === 'function') {
          try {
            let promise;
            try {
              promise = reqFs.call(screenEl, { navigationUI: 'hide' });
            } catch (optErr) {
              promise = reqFs.call(screenEl);
            }
            if (promise && typeof promise.catch === 'function') {
              promise.catch(() => {});
            }
          } catch (e) {}
        }

        if (screen.orientation && typeof screen.orientation.lock === 'function') {
          screen.orientation.lock('landscape')
            .then(() => {
              orientationLockedByPlayer = true;
              updateFullscreenRotationFallback();
            })
            .catch(() => {
              orientationLockedByPlayer = false;
              updateFullscreenRotationFallback();
            });
        } else {
          orientationLockedByPlayer = false;
        }

        updateFullscreenRotationFallback();
        setTimeout(syncViewportLayout, 60);
        setTimeout(syncViewportLayout, 250);
      }

      function exitFullscreenMode(triggeredByNativeEvent = false) {
        isFullscreenMode = false;
        fsButtonVisible = true;

        document.documentElement.classList.remove('fs-lock');
        document.body.classList.remove('fs-lock');

        const screenEl = document.getElementById('playerScreen');
        const stageEl = document.getElementById('videoStage');
        screenEl.classList.remove('fs-active', 'fs-rotate-fallback');
        stageEl.style.width = '';
        stageEl.style.height = '';
        setFsExitButtonVisible(true);

        const nativeFsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
        if (nativeFsEl && !triggeredByNativeEvent) {
          const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
          if (typeof exitFn === 'function') {
            try {
              const p = exitFn.call(document);
              if (p && typeof p.catch === 'function') p.catch(() => {});
            } catch (e) {}
          }
        }

        unlockMobileOrientation();
        setTimeout(syncViewportLayout, 60);
      }

      (function initFullscreenTapGestures() {
        const stageEl = document.getElementById('videoStage');
        const exitBtn = document.getElementById('fsExitBtn');
        if (!stageEl || !exitBtn) return;

        let downX = 0;
        let downY = 0;
        let pointerDownOnStage = false;
        let lastStageToggleAt = 0;
        let lastExitActionAt = 0;

        function triggerExitFullscreen(e) {
          if (e) {
            e.stopPropagation();
            if (typeof e.preventDefault === 'function') e.preventDefault();
          }
          const now = performance.now();
          if (now - lastExitActionAt < 300) return;
          lastExitActionAt = now;
          exitFullscreenMode(false);
        }

        exitBtn.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
        });
        exitBtn.addEventListener('pointerup', triggerExitFullscreen);
        exitBtn.addEventListener('click', triggerExitFullscreen);

        stageEl.addEventListener('pointerdown', (e) => {
          if (!isFullscreenMode) {
            pointerDownOnStage = false;
            return;
          }
          if (e.target && e.target.closest('#fsExitBtn')) {
            pointerDownOnStage = false;
            return;
          }
          if (typeof e.button === 'number' && e.button !== 0) {
            pointerDownOnStage = false;
            return;
          }
          pointerDownOnStage = true;
          downX = e.clientX;
          downY = e.clientY;
        });

        stageEl.addEventListener('pointerup', (e) => {
          if (!isFullscreenMode || !pointerDownOnStage) return;
          pointerDownOnStage = false;
          if (e.target && e.target.closest('#fsExitBtn')) return;

          const dist = Math.hypot((e.clientX || 0) - downX, (e.clientY || 0) - downY);
          if (dist > 16) return;

          lastStageToggleAt = performance.now();
          setFsExitButtonVisible(!fsButtonVisible);
        });

        stageEl.addEventListener('pointercancel', () => {
          pointerDownOnStage = false;
        });

        stageEl.addEventListener('click', (e) => {
          if (!isFullscreenMode) return;
          if (e.target && e.target.closest('#fsExitBtn')) return;
          if (performance.now() - lastStageToggleAt < 350) return;
          setFsExitButtonVisible(!fsButtonVisible);
        });
      })();

      function handleNativeFullscreenChange() {
        const nativeFsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
        if (!nativeFsEl && isFullscreenMode) {
          exitFullscreenMode(true);
        } else if (nativeFsEl && isFullscreenMode) {
          syncViewportLayout();
        }
      }

      document.addEventListener('fullscreenchange', handleNativeFullscreenChange);
      document.addEventListener('webkitfullscreenchange', handleNativeFullscreenChange);

      syncViewportLayout();
      window.addEventListener('resize', syncViewportLayout, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewportLayout, { passive: true });
      }
      window.addEventListener('orientationchange', () => {
        setTimeout(syncViewportLayout, 60);
        setTimeout(syncViewportLayout, 260);
      }, { passive: true });
      if (screen.orientation && screen.orientation.addEventListener) {
        screen.orientation.addEventListener('change', syncViewportLayout);
      }

      /* ============================================================
         13. THEME, VIEW MODE & KEYBOARD SHORTCUTS
         ============================================================ */
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('sy_movies_theme', theme);
        document.getElementById('btnTheme').textContent = theme === 'light' ? '☾' : '☀';
        document.getElementById('metaThemeColor').setAttribute('content', theme === 'light' ? '#e3e8ef' : '#0c1320');
      }

      function toggleTheme() {
        const cur = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(cur === 'light' ? 'dark' : 'light');
      }

      applyTheme(localStorage.getItem('sy_movies_theme') || 'light');

      function syncViewModeButtonIcon() {
        const iconSvg = document.getElementById('viewIconSvg');
        const btnView = document.getElementById('btnView');
        if (!iconSvg) return;
        if (viewMode === 'list') {
          iconSvg.innerHTML = `<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>`;
          if (btnView) btnView.setAttribute('title', 'Switch to Grid View');
        } else {
          iconSvg.innerHTML = `<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>`;
          if (btnView) btnView.setAttribute('title', 'Switch to List View');
        }
      }

      syncViewModeButtonIcon();

      document.addEventListener('keydown', (e) => {
        if (e.target && e.target.getAttribute('role') === 'button' && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault();
          e.target.click();
          return;
        }

        if (!document.getElementById('playerScreen').classList.contains('open')) return;

        if (e.key === 'Escape') {
          if (document.getElementById('modalBackdrop').classList.contains('open')) closeModal();
          else if (isFullscreenMode) exitFullscreenMode(false);
          else closePlayer();
        } else if (e.key === ' ' && document.activeElement.getAttribute('role') !== 'button' && document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          togglePlayPause();
        } else if (e.key === 'ArrowRight') {
          skipBy(10);
        } else if (e.key === 'ArrowLeft') {
          skipBy(-10);
        } else if (e.key === 'f' || e.key === 'F') {
          if (isFullscreenMode) exitFullscreenMode(false);
          else enterFullscreenMode();
        }
      });

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2300);
      }

      function formatClock(sec) {
        const s = Math.floor(sec || 0);
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const r = s % 60;
        if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
        return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
      }

      function formatExactHMS(sec) {
        const s = Math.max(0, Math.floor(sec || 0));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const r = s % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
      }

      function escapeHtml(s) {
        return String(s).replace(/[<>"'&]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
      }

      /* ============================================================
         14. BOOTSTRAP ON LOAD
         ============================================================ */
      window.addEventListener('DOMContentLoaded', () => {
        initPeerNode();
        renderExplorer();
      });
    </script>
  </body>
</html>
